<!DOCTYPE html>
<html lang="en" style="height: 100%;">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Karl2D Web Build</title>

		<!-- Karl2D fills in the href: with its default icon at init and from set_window_icon. -->
		<link id="karl2d-favicon" rel="icon" href="">
	</head>
	<body id="body" style="height: 100%; padding: 0; margin: 0; overflow: hidden; background-color: black;">
		<!-- touch-action: none keeps the browser from turning touches into page scroll/zoom, and stops
		     it cancelling a gesture Karl2D is in the middle of. The mouse events a browser fires after
		     a tap are ignored: Karl2D listens for pointer events, which those are not, so a tap cannot
		     arrive as both a touch and a click. -->
		<canvas id="webgl-canvas" style="touch-action: none;" oncontextmenu="return false;" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>

		<script type="text/javascript" src="audio_backend_web_audio.js"></script>
		<script type="text/javascript" src="odin.js"></script>
		<script type="text/javascript">
			if (window.parent !== window) {
				// This prevents keyboard commands from triggering outside of the iframe.
				document.getElementById('body').addEventListener('keydown', (ev) => ev.preventDefault());
			}
			async function run() {
				const wasmMemoryInterface = new odin.WasmMemoryInterface();
				wasmMemoryInterface.setIntSize(4);

				let imports = odin.setupDefaultImports(wasmMemoryInterface, null, wasmMemoryInterface.memory);
				imports = { ...imports, ...karl2dAudioJsImports };

				const response = await fetch("main.wasm");
				const file = await response.arrayBuffer();
				const wasm = await WebAssembly.instantiate(file, imports);
				const exports = wasm.instance.exports;
				wasmMemoryInterface.setExports(exports);

				if (exports.memory) {
					wasmMemoryInterface.setMemory(exports.memory);
					setKarl2dAudioWasmMemory(exports.memory);
				}

				if (exports._start) {
					exports._start();
				}

				if (exports.step) {
					const odin_ctx = exports.default_context_ptr();

					let prevTimeStamp = undefined;
					function step(currTimeStamp) {
						if (prevTimeStamp == undefined) {
							prevTimeStamp = currTimeStamp;
						}

						const dt = (currTimeStamp - prevTimeStamp)*0.001;
						prevTimeStamp = currTimeStamp;

						if (!exports.step(dt, odin_ctx)) {
							if (exports.shutdown) {
								exports.shutdown(dt, odin_ctx);
							}
							if (exports._end) {
								exports._end();
							}
							return;
						}

						window.requestAnimationFrame(step);
					}

					window.requestAnimationFrame(step);
				}
			}

			run();
		</script>
	</body>
</html>
