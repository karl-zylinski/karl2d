<!DOCTYPE html>
<html lang="en" style="height: 100%;">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Karl2D Web Build</title>
	</head>
	<body id="body" style="height: 100%; padding: 0; margin: 0; overflow: hidden; background-color: black;">
		<!-- touch-action: none stops the browser from treating touches on the canvas as page
		     gestures. Without it a pinch zooms the whole page, canvas and all, and a drag scrolls
		     it, so the game sees a half-finished gesture at coordinates that no longer line up
		     with what is on screen. -->
		<canvas id="webgl-canvas" style="touch-action: none;" oncontextmenu="return false;" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>

		<script type="text/javascript">
			// Browsers follow a tap with synthetic mousedown/mouseup/click events, so that a page
			// written only for mouse input still works with touch. Karl2D now produces those itself
			// (see set_touch_mouse_emulation in karl2d.odin), so the browser's copy has to be
			// stopped or every tap would fire twice. preventDefault() on touchstart is what tells
			// the browser to skip the synthetic events for that touch; { passive: false } is
			// required for the call to have any effect, since browsers otherwise assume a
			// touchstart listener never calls it and ignore it for scroll performance.
			//
			// preventDefault() here also means the canvas no longer receives the onmousedown above
			// for a touch (that handler only ever ran because of the synthetic mousedown), so focus
			// is requested explicitly instead.
			(() => {
				const canvas = document.getElementById('webgl-canvas');

				canvas.addEventListener('touchstart', (ev) => {
					ev.preventDefault();
					canvas.focus();
				}, { passive: false });

				canvas.addEventListener('touchend', (ev) => {
					ev.preventDefault();
				}, { passive: false });
			})();
		</script>

		<script type="text/javascript" src="audio_backend_web_audio.js"></script>
		<script type="text/javascript" src="odin.js"></script>
		<script type="text/javascript">
			if (window.parent !== window) {
				// This prevents keyboard commands from triggering outside of the iframe.
				document.getElementById('body').addEventListener('keydown', (ev) => ev.preventDefault());
			}
			async function run() {
				const wasmMemoryInterface = new odin.WasmMemoryInterface();
				wasmMemoryInterface.setIntSize(4);

				let imports = odin.setupDefaultImports(wasmMemoryInterface, null, wasmMemoryInterface.memory);
				imports = { ...imports, ...karl2dAudioJsImports };

				const response = await fetch("main.wasm");
				const file = await response.arrayBuffer();
				const wasm = await WebAssembly.instantiate(file, imports);
				const exports = wasm.instance.exports;
				wasmMemoryInterface.setExports(exports);

				if (exports.memory) {
					wasmMemoryInterface.setMemory(exports.memory);
					setKarl2dAudioWasmMemory(exports.memory);
				}

				if (exports._start) {
					exports._start();
				}

				if (exports.step) {
					const odin_ctx = exports.default_context_ptr();

					let prevTimeStamp = undefined;
					function step(currTimeStamp) {
						if (prevTimeStamp == undefined) {
							prevTimeStamp = currTimeStamp;
						}

						const dt = (currTimeStamp - prevTimeStamp)*0.001;
						prevTimeStamp = currTimeStamp;

						if (!exports.step(dt, odin_ctx)) {
							if (exports.shutdown) {
								exports.shutdown(dt, odin_ctx);
							}
							if (exports._end) {
								exports._end();
							}
							return;
						}

						window.requestAnimationFrame(step);
					}

					window.requestAnimationFrame(step);
				}
			}

			run();
		</script>
	</body>
</html>
